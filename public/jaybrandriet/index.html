<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jay Brandriet — The archive</title><meta name="description" content="Explore Jay Brandriet’s writing on basketball, football, sports and life."><style>
:root{--paper:#f5f2eb;--ink:#162c2a;--accent:#cc4b2c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}a{color:inherit}header,main,footer{max-width:1440px;margin:auto;padding:26px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid #c9cec4;align-items:center}.brand{font-size:22px;font-weight:900;text-decoration:none;letter-spacing:-1px}header a:last-child{font-size:12px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--accent)}h1{font-family:Georgia,serif;font-size:clamp(52px,8vw,112px);font-weight:400;letter-spacing:-5px;line-height:.97;margin:25px 0} .intro{display:flex;justify-content:space-between;align-items:end;gap:30px;padding:26px 0 50px}.intro p{max-width:340px;line-height:1.6;color:#5a6863}.hero{display:grid;grid-template-columns:1.3fr 1fr;background:var(--ink);color:var(--paper);margin-bottom:55px;min-height:420px;cursor:pointer}.hero img{width:100%;height:450px;object-fit:cover}.hero div{padding:48px;display:flex;flex-direction:column;justify-content:center}.hero h2{font:42px/1.1 Georgia,serif;margin:18px 0 30px;text-transform:none}.meta{font-size:11px;text-transform:uppercase;letter-spacing:1px}.toolbar{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid #c9cec4;padding:25px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{cursor:pointer;border:1px solid #c3c9bf;background:transparent;padding:10px 17px;border-radius:25px;color:var(--ink)}button.active{background:var(--ink);color:white}input{border:0;border-bottom:1px solid #a7b2a6;background:transparent;padding:12px;width:250px}#count{font-size:12px;color:#637066;margin:5px 0 24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 27px}.card{border:0;background:none;padding:0;text-align:left;border-radius:0;display:block;width:100%;color:var(--ink)}.card img{width:100%;height:240px;object-fit:cover;background:#d9dfd2}.card .meta{margin-top:18px;color:#6d766f}.card h2{font:26px/1.2 Georgia,serif;text-transform:none}.card:hover h2{text-decoration:underline}.more{display:block;margin:40px auto}footer{border-top:1px solid #c9cec4;margin-top:70px;font-size:12px;display:flex;justify-content:space-between;gap:20px}dialog{border:0;background:var(--paper);color:var(--ink);width:min(900px,95vw);max-height:92vh;padding:35px}dialog::backdrop{background:#09221ed9}dialog h2{font:40px/1.1 Georgia,serif}dialog .body{font:18px/1.75 Georgia,serif;overflow-wrap:anywhere}dialog img{max-width:100%;height:auto}dialog iframe{max-width:100%}dialog .close{float:right}dialog a{color:#a43e23}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}@media(max-width:750px){.intro{display:block}h1{letter-spacing:-2px}.hero{grid-template-columns:1fr}.hero img{height:300px}.hero div{padding:28px}.hero h2{font-size:32px}.grid{grid-template-columns:1fr 1fr}.card img{height:180px}}@media(max-width:450px){.grid{grid-template-columns:1fr}header a:last-child{max-width:100px}.card img{height:260px}}
</style><header><a class="brand" href="/jaybrandriet">jaybrandriet<span style="color:var(--accent)">.</span></a><a href="https://jaybrandriet.com/" target="_blank" rel="noopener">Visit original journal ↗</a></header><main><section class="intro"><div><span class="eyebrow">The collected writing of Jay Brandriet</span><h1>For the love<br>of the game.</h1></div><p>Basketball, football, and the stories beyond the scoreboard. Explore Jay’s perspective, one article at a time.</p></section><section id="hero"></section><div class="toolbar"><div class="filters" id="filters"></div><label><span class="meta">Search archive </span><input id="search" type="search" placeholder="Players, stories, moments…"></label></div><p id="count" aria-live="polite"></p><div class="grid" id="grid"></div><button class="more" id="more">Load more stories ↓</button></main><footer><b>Jay Brandriet · The archive</b><span>217 articles · <a href="https://jaybrandriet.com/">Source: jaybrandriet.com</a></span></footer><dialog id="reader"><button class="close" aria-label="Close article">Close ×</button><div id="article"></div></dialog><script>
let posts=[],category='All',limit=12;const $=s=>document.querySelector(s);const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});function openPost(p){$('#article').innerHTML='<p class="meta">'+date(p.date)+' · '+escape(p.categories.join(' / '))+'</p><h2>'+escape(p.title)+'</h2><div class="body">'+p.content+'</div><p><a target="_blank" rel="noopener" href="'+p.url+'">Read on the original site ↗</a></p>';$('#reader').showModal();history.replaceState(null,'','#article-'+p.id)}function render(){let q=$('#search').value.toLowerCase();let found=posts.filter(p=>(category==='All'||p.categories.includes(category))&&(!q||(p.title+' '+p.text).toLowerCase().includes(q)));$('#count').textContent=found.length+(found.length===1?' story':' stories')+(category==='All'?' in the archive':' in '+category);$('#grid').replaceChildren();found.slice(0,limit).forEach(p=>{let b=document.createElement('button');b.className='card';b.innerHTML=(p.image?'<img loading="lazy" src="'+escape(p.image)+'" alt="">':'')+'<div class="meta">'+escape(p.categories.join(' / '))+' · '+date(p.date)+'</div><h2>'+escape(p.title)+'</h2>';b.onclick=()=>openPost(p);$('#grid').append(b)});$('#more').hidden=found.length<=limit}fetch('/jaybrandriet/data.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{posts=data;let p=posts[0];let hero=document.createElement('button');hero.className='card hero';hero.innerHTML='<img src="'+escape(p.image)+'" alt=""><div><span class="eyebrow">Latest story / '+date(p.date)+'</span><h2>'+escape(p.title)+'</h2><span>Read the story ↗</span></div>';hero.onclick=()=>openPost(p);$('#hero').append(hero);['All',...new Set(posts.flatMap(p=>p.categories))].forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c==='All'?'active':'';b.onclick=()=>{category=c;limit=12;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()};$('#filters').append(b)});render();let match=location.hash.match(/article-(\d+)/);if(match){let p=posts.find(x=>x.id==match[1]);if(p)openPost(p)}}).catch(()=>$('#count').textContent='The archive could not load. Please reload the page.');$('#search').oninput=()=>{limit=12;render()};$('#more').onclick=()=>{limit+=12;render()};$('.close').onclick=()=>{$('#reader').close();history.replaceState(null,'',location.pathname)};$('#reader').addEventListener('click',e=>{if(e.target===$('#reader'))$('#reader').close()});
</script></html>
